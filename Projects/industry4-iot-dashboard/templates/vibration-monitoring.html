<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Vibration Monitoring</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/loaders/GLTFLoader.js"></script>
    <script defer src="../static/js/scripts.js"></script>
    <link rel="stylesheet" href="../static/vibration.css"></head>
</head>
<body class="p-4">

<div class="navigation">
    <h1 id="Dashboard-header">Industry 4.0 Dashboard</h1>
    <nav id="primary_nav_wrap">
        <ul>
            <li><a href="/">Home</a></li>
            <li><a href="/tool-drop">Tool Drop</a></li>
            <li class="current-menu-item"><a href="/vibration-monitoring">Vibration</a></li>
            <li><a href="/agv-collision">AGV</a></li>
            <li><a href="/package-drop">Package Drop</a></li>
            <li><a href="/worker-fatigue">Worker Fatigue</a></li>
            <li><a href="/addresses">IP Manager</a></li>
        </ul>
    </nav>
</div>

<div class="container">
    <h2>Machine Vibration Monitoring</h2>

    <div class="d-flex justify-content-center align-items-center gap-5 flex-wrap">

        <!-- Sound Level -->
        <div class="sensor-box text-center" style="min-width: 250px;">
            <div>Sound Level</div>
            <div class="progress" style="height: 40px;">
                <div id="soundLevelBar" class="progress-bar bg-warning" role="progressbar"
                     style="width: 0%;" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">0.00000
                </div>
            </div>
        </div>

        <!-- Tilt -->
        <div class="sensor-box text-center" style="min-width: 100px;">
            <div>Tilt</div>
            <div id="tiltValue">0.00</div>
        </div>

        <div id="coords">
            X: <span id="xCoord">0</span><br>
            Y: <span id="yCoord">0</span><br>
            Z: <span id="zCoord">0</span>
        </div>

    </div>

    <div class="row mt-4">
        <div class="col-md-6">
            <canvas id="vibrationChart"></canvas>
        </div>
        <div class="col-md-3">
            <svg version="1.0" xmlns="http://www.w3.org/2000/svg"
                 width="400pt" height="800pt" viewBox="0 0 300 600"
                 preserveAspectRatio="xMidYMid meet">

                <!-- Original SVG paths -->
                <g transform="translate(0,400) scale(0.1,-0.1)" fill="#000000" stroke="none">
                </g>

                <!-- X Axis in Red -->
                <line id="xAxis" x1="50" y1="350" x2="200" y2="350" stroke="red" stroke-width="2"/>
                <text x="205" y="355" fill="red" font-size="14">X</text>

                <!-- Y Axis in Green -->
                <line id="yAxis" x1="50" y1="350" x2="50" y2="200" stroke="green" stroke-width="2"/>
                <text x="55" y="195" fill="green" font-size="14">Y</text>

                <!-- Z Axis in Blue -->
                <line id="zAxis" x1="50" y1="350" x2="130" y2="270" stroke="blue" stroke-width="2"/>
                <text x="135" y="265" fill="blue" font-size="14">Z</text>
            </svg>
        </div>
    </div>

    <div class="mt-4">
        <button class="btn btn-secondary" onclick="exportFullAccelCSV()">Export CSV</button>
        <button class="btn" id="toggleToolDropBtn">Stop Updates</button>
        <span id="toolDropStatus" style="margin-left: 10px; font-weight: bold;">Updating</span>
    </div>

    <script>
    let toolDropUpdating = true;  // assume updates start enabled

async function toggleToolDropUpdates() {
const action = toolDropUpdating ? 'stop' : 'start';

try {
const response = await fetch('/api/toggle_updates', {
  method: 'POST',
  headers: { 'Content-Type': 'application/json' },
  body: JSON.stringify({ target: 'vibration', action })
});
const data = await response.json();

if (data.status === 'success') {
  toolDropUpdating = data.is_updating;

  document.getElementById('toggleToolDropBtn').textContent = toolDropUpdating ? 'Stop Updates' : 'Start Updates';
  document.getElementById('toolDropStatus').textContent = toolDropUpdating ? 'Updating' : 'Paused';
  document.getElementById('toolDropStatus').style.color = toolDropUpdating ? 'green' : 'red';
} else {
  console.error('Toggle failed:', data.error);
}
} catch (err) {
console.error('Error toggling updates:', err);
}
}

// Attach the click handler
document.getElementById('toggleToolDropBtn').addEventListener('click', toggleToolDropUpdates);

</script>
</div>

</body>
</html>
