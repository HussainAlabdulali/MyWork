<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Package Drop Logging</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script defer src="../static/js/scripts.js"></script>
    <link rel="stylesheet" href="../static/package.css"></head>
</head>
<body class="p-4">

<div class="navigation">
    <h1 id="Dashboard-header">Industry 4.0 Dashboard</h1>
    <nav id="primary_nav_wrap">
        <ul>
            <li><a href="/">Home</a></li>
            <li><a href="/tool-drop">Tool Drop</a></li>
            <li><a href="/vibration-monitoring">Vibration</a></li>
            <li><a href="/agv-collision">AGV</a></li>
            <li class="current-menu-item"><a href="/package-drop">Package Drop</a></li>
            <li><a href="/worker-fatigue">Worker Fatigue</a></li>
            <li><a href="/addresses">IP Manager</a></li>
        </ul>
    </nav>
</div>

<div class="container">
    <h2>Package Drop Logging</h2>

    <label class="form-label">Sound Level</label>
    <div class="mt-4">
        <div class="progress" style="height: 30px;">
            <div id="soundLevelBar" class="progress-bar bg-warning" role="progressbar"
                 style="width: 0%;" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">0.00000
            </div>
        </div>
    </div>

    <div class="mt-4" id="dropGifContainer">
        <img id="dropGif" src="" alt="Drop Animation" style="display:none; max-width: 250px;">
        <div id="dropSeverity" style="font-weight: bold; margin-top: 10px; text-align: left; width: 100%;"></div>
    </div>

    <div class="mt-4">
        <ul id="packageLog" class="list-group"></ul>
    </div>

    <div class="mt-4">
        <button class="btn btn-secondary" onclick="downloadPackageDrop()">Export CSV</button>
        <button class="btn" id="toggleToolDropBtn">Stop Updates</button>
        <span id="toolDropStatus" style="margin-left: 10px; font-weight: bold;">Updating</span>
    </div>
</div>

<script>
    function downloadPackageDrop() {
        const link = document.createElement('a');
        link.href = '/collision-data.csv';
        link.download = 'collision-data.csv';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    };
</script>

<script>
    async function fetchSensorData() {
      try {
        const response = await fetch('/api/read'); // Adjust endpoint if needed
        const data = await response.json();

        // Assume data has keys: temp and light
        const temp = data.temp;
        const light = data.light;

        document.getElementById('temperatureValue').textContent = `${temp?.toFixed(1) ?? '--'} °C`;
        document.getElementById('lightValue').textContent = `${light?.toFixed(0) ?? '--'} lx`;
      } catch (error) {
        console.error("Failed to fetch sensor data:", error);
        document.getElementById('temperatureValue').textContent = `-- °C`;
        document.getElementById('lightValue').textContent = `-- lx`;
      }
    }

    fetchSensorData(); // Initial load
    setInterval(fetchSensorData, 2000); // Optional: update every 2 seconds
</script>

<script>
    let toolDropUpdating = true;  // assume updates start enabled

    async function toggleToolDropUpdates() {
    const action = toolDropUpdating ? 'stop' : 'start';

    try {
    const response = await fetch('/api/toggle_updates', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ target: 'package_drop', action })
    });
    const data = await response.json();

    if (data.status === 'success') {
      toolDropUpdating = data.is_updating;

      document.getElementById('toggleToolDropBtn').textContent = toolDropUpdating ? 'Stop Updates' : 'Start Updates';
      document.getElementById('toolDropStatus').textContent = toolDropUpdating ? 'Updating' : 'Paused';
      document.getElementById('toolDropStatus').style.color = toolDropUpdating ? 'var(--success-color)' : 'var(--danger-color)';
    } else {
      console.error('Toggle failed:', data.error);
    }
    } catch (err) {
    console.error('Error toggling updates:', err);
    }
    }

    // Attach the click handler
    document.getElementById('toggleToolDropBtn').addEventListener('click', toggleToolDropUpdates);

</script>

</body>
</html>
