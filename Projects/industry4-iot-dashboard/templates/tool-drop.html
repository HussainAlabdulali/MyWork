<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tool Drop Detection</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script defer src="../static/js/scripts.js"></script>
    <link rel="stylesheet" href="../static/tool-drop.css"></head>
</head>
<body class="p-4">

<div class="navigation">
    <h1 id="Dashboard-header">Industry 4.0 Dashboard</h1>
    <nav id="primary_nav_wrap">
        <ul>
            <li><a href="/">Home</a></li>
            <li class="current-menu-item"><a href="/tool-drop">Tool Drop</a></li>
            <li><a href="/vibration-monitoring">Vibration</a></li>
            <li><a href="/agv-collision">AGV</a></li>
            <li><a href="/package-drop">Package Drop</a></li>
            <li><a href="/worker-fatigue">Worker Fatigue</a></li>
            <li><a href="/addresses">IP Manager</a></li>
        </ul>
    </nav>
</div>

<div class="container">
    <h2>Tool Drop Detection</h2>

    <label class="form-label">Drop Sensitivity Threshold</label>
    <input type="range" class="form-range" id="toolDropThreshold" style="color: white;" min="1" max="10" value="5">

    <div class="mt-4 d-flex justify-content-center align-items-center gap-5">
        <div class="d-flex align-items-center gap-2">
            <div id="toolLed" class="led led-green"></div>
            <span id="ledStatusText">Status: Good</span>
        </div>

        <div class="d-flex align-items-center gap-2">
            <div id="magLatchLed" class="led led-green"></div>
            <span id="magLatchStatusText">Magnetic Latch</span>
        </div>
    </div>

    <label class="form-label mt-4">Sound Level</label>
    <div class="progress" style="height: 30px;">
        <div id="soundLevelBar" class="progress-bar bg-warning" role="progressbar"
             style="width: 0%;" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">0
        </div>
    </div>

    <label class="form-label mt-4">Drop Magnitude</label>
    <div class="progress" style="height: 30px;">
        <div id="dropMagnitudeBar" class="progress-bar bg-info" role="progressbar"
             style="width: 0%;" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">0
        </div>
    </div>

    <div class="mt-4">
        <div id="alertMessage" style="display: none; color: red; font-weight: bold;"></div>
        <img id="toolDropGif" src="../static/pics/tool-drop.gif" alt="Tool Drop Animation">
    </div>

    <div class="mt-4">
        <button class="btn btn-secondary" onclick="downloadToolDrop()">Export CSV</button>
        <button class = "btn" id="toggleToolDropBtn">Stop Updates</button>
        <span id="toolDropStatus" style="margin-left: 10px; font-weight: bold;">Updating</span>
    </div>

    <script>
        function downloadToolDrop() {
            const link = document.createElement('a');
            link.href = '/tool-drop-detection.csv';
            link.download = 'tool-drop-detection.csv';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        };
    </script>

    <script>
        let toolDropUpdating = true;  // assume updates start enabled

async function toggleToolDropUpdates() {
  const action = toolDropUpdating ? 'stop' : 'start';

  try {
    const response = await fetch('/api/toggle_updates', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ target: 'tool_drop', action })
    });
    const data = await response.json();

    if (data.status === 'success') {
      toolDropUpdating = data.is_updating;

      document.getElementById('toggleToolDropBtn').textContent = toolDropUpdating ? 'Stop Updates' : 'Start Updates';
      document.getElementById('toolDropStatus').textContent = toolDropUpdating ? 'Updating' : 'Paused';
      document.getElementById('toolDropStatus').style.color = toolDropUpdating ? 'green' : 'red';
    } else {
      console.error('Toggle failed:', data.error);
    }
  } catch (err) {
    console.error('Error toggling updates:', err);
  }
}

// Attach the click handler
document.getElementById('toggleToolDropBtn').addEventListener('click', toggleToolDropUpdates);

    </script>
</div>

</body>
</html>
