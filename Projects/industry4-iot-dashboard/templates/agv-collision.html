<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AGV Collision Detection</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script defer src="../static/js/scripts.js"></script>
    <link rel="stylesheet" href="../static/agv.css"></head>
</head>
<body>

<div class="navigation">
    <h1 id="Dashboard-header">Industry 4.0 Dashboard</h1>
    <nav id="primary_nav_wrap">
        <ul>
            <li><a href="/">Home</a></li>
            <li><a href="/tool-drop">Tool Drop</a></li>
            <li><a href="/vibration-monitoring">Vibration</a></li>
            <li class="current-menu-item"><a href="/agv-collision">AGV</a></li>
            <li><a href="/package-drop">Package Drop</a></li>
            <li><a href="/worker-fatigue">Worker Fatigue</a></li>
            <li><a href="/addresses">IP Manager</a></li>
        </ul>
    </nav>
</div>

<div class="container">
    <h2>AGV Tipping/Collision Detection</h2>

    <label class="form-label">Collision Detection Threshold</label>
    <input type="range" class="form-range" id="agvThreshold" min="1" max="10" value="5">

    <div id="tiltContainer">
        <h3>Orientation</h3>
        <p>Pitch: <span id="pitchValue">0°</span></p>
        <p>Roll: <span id="rollValue">0°</span></p>
    </div>

    <div class="led-container">
        <div id="ledBallContainer">
            <h3>Collision Indicator</h3>
            <div id="ledBall" class="led-ball green"></div>
        </div>

        <div id="BallContainer">
            <h3>Tilt Indicator</h3>
            <div id="Ball" class="led-ball green"></div>
        </div>
    </div>

    <model-viewer
            src="../static/pics/agv.glb"
            alt="AGV model"
            auto-rotate
            camera-controls
    ></model-viewer>

    <div class="mt-4">
        <button class="btn btn-secondary" onclick="downloadAgvData()">Export CSV</button>
        <button class="btn" id="toggleToolDropBtn">Stop Updates</button>
        <span id="toolDropStatus">Updating</span>
    </div>
</div>

<script>
    function downloadAgvData() {
        const link = document.createElement('a');
        link.href = '/agv-data.csv';
        link.download = 'agv-data.csv';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    let toolDropUpdating = true;  // assume updates start enabled

    async function toggleToolDropUpdates() {
        const action = toolDropUpdating ? 'stop' : 'start';

        try {
            const response = await fetch('/api/toggle_updates', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ target: 'agv', action })
            });
            const data = await response.json();

            if (data.status === 'success') {
                toolDropUpdating = data.is_updating;

                document.getElementById('toggleToolDropBtn').textContent = toolDropUpdating ? 'Stop Updates' : 'Start Updates';
                document.getElementById('toolDropStatus').textContent = toolDropUpdating ? 'Updating' : 'Paused';
                document.getElementById('toolDropStatus').style.color = toolDropUpdating ? 'var(--success-color)' : 'var(--danger-color)';
            } else {
                console.error('Toggle failed:', data.error);
            }
        } catch (err) {
            console.error('Error toggling updates:', err);
        }
    }

    // Attach the click handler
    document.getElementById('toggleToolDropBtn').addEventListener('click', toggleToolDropUpdates);
</script>

</body>
</html>
